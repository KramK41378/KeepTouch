<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeepTouch</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow-x: hidden;
        }
        .content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 50px;
        }
        .logo-img {
            width: 100%;
            height: auto;
            display: block;
        }
        .start-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 1.8rem 3.5rem;
            font-size: 2.2rem;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(52, 152, 219, 0.4);
            min-width: 22rem;
        }
        .start-btn:hover {
            background-color: #2980b9;
            transform: translateY(-4px);
            box-shadow: 0 12px 20px rgba(52, 152, 219, 0.6);
        }
        .start-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="content">
        <img src="images/KeepTouchWord.png" alt="KeepTouch" class="logo-img">
        <button class="start-btn" onclick="alert('Добро пожаловать в KeepTouch!')">Начать работу</button>
    </div>
</body>
</html>
