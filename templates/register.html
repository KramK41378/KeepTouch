<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.2, minimum-scale=0.8">
    <title>KeepTouch — Регистрация</title>
    <link rel="icon" href="images/icon.png" type="image/png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow-x: hidden;
            color: #ffffff;
        }
        .content {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            padding: 40px 20px;
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
        .logo-img {
            width: 60%;
            height: auto;
            display: block;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5rem;
            margin: 0 0 30px 0;
            color: #3498db;
            text-shadow: 0 2px 5px rgba(52, 152, 219, 0.3);
        }
        .form-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }
        label {
            font-weight: bold;
            margin-left: 5px;
            color: #cccccc;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 1rem;
            border: none;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            background-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.4);
        }
        .register-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 1.2rem 2.5rem;
            font-size: 1.3rem;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(39, 174, 96, 0.4);
            margin-top: 10px;
            width: 100%;
        }
        .register-btn:hover {
            background-color: #219955;
            transform: translateY(-4px);
            box-shadow: 0 12px 20px rgba(39, 174, 96, 0.6);
        }
        .register-btn:active {
            transform: translateY(0);
        }
        .login-link {
            color: #3498db;
            text-decoration: none;
            font-size: 1rem;
            transition: color 0.2s;
            margin-top: 15px;
            font-weight: bold;
        }
        .login-link:hover {
            color: #5dade2;
            text-decoration: underline;
        }
        .password-hint {
            font-size: 0.8rem;
            color: #999;
            text-align: left;
            width: 100%;
            margin-left: 5px;
        }
        #site-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px 0;
            color: #999;
            font-size: 13px;
            text-align: center;
            background-color: #000000;
            z-index: 1000;
        }
        #site-footer a {
            color: #3498db;
            text-decoration: none;
            margin-left: 6px;
            transition: color 0.2s;
        }
        #site-footer a:hover {
            color: #5dade2;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="content">
        <img src="images/KeepTouchWord.png" alt="KeepTouch" class="logo-img">
        <h1>Регистрация в KeepTouch</h1>
        <form id="registerForm">
            <div class="form-group">
                <label for="fullname">Полное имя</label>
                <input type="text" id="fullname" name="fullname" placeholder="Введите ваше полное имя" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Введите ваш email" required>
            </div>
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" name="username" placeholder="Придумайте имя пользователя" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Придумайте пароль" required>
                <div class="password-hint">Пароль должен содержать не менее 8 символов, включая буквы и цифры</div>
            </div>
            <div class="form-group">
                <label for="confirm-password">Подтвердите пароль</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Повторите пароль" required>
            </div>
            <button type="submit" class="register-btn">Зарегистрироваться</button>
            <a href="login.html" class="login-link">Уже есть аккаунт? Войти</a>
        </form>
    </div>
    <div id="site-footer">
        © 2026 KeepTouch. Все права защищены. | <a href="policy.html">Политика конфиденциальности</a>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const fullname = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // Простая проверка совпадения паролей
            if (password !== confirmPassword) {
                alert('Пароли не совпадают. Пожалуйста, проверьте введённые данные.');
                return;            }

            // Простая проверка длины пароля
            if (password.length < 8) {
                alert('Пароль должен содержать не менее 8 символов.');
                return;
            }

            // Проверка наличия хотя бы одной буквы и одной цифры в пароле
            const hasLetter = /[a-zA-Z]/.test(password);
            const hasDigit = /\d/.test(password);

            if (!hasLetter || !hasDigit) {
                alert('Пароль должен содержать хотя бы одну букву и одну цифру.');
                return;
            }

            // Базовая проверка формата email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('Пожалуйста, введите корректный email-адрес.');
                return;
            }

            // Если все проверки пройдены, имитируем отправку данных
            alert(`Регистрация успешна! Добро пожаловать, ${fullname}!`);

            // Здесь можно добавить код для отправки данных на сервер
            /*
            fetch('/api/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    fullname: fullname,
                    email: email,
                    username: username,
                    password: password
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(`Регистрация успешна! Добро пожаловать, ${fullname}!`);
                } else {
                    alert('Ошибка регистрации: ' + data.message);
                }
            })
            .catch(error => {
                alert('Произошла ошибка при регистрации. Пожалуйста, попробуйте снова.');
                console.error('Error:', error);
            });
            */
        });
    </script>
</body>
</html>
