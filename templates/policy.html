<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Политика конфиденциальности</title>
    <link rel="icon" href="{{ url_for('static', 'images/icon.png') }}" type="image/png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow-x: hidden;
        }
        .content {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px 20px;
        }
        .content p {
            color: #ffffff;
            font-size: 1.2rem;
            line-height: 1.6;
            margin: 0;
        }
        #site-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px 0;
            color: #999;
            font-size: 13px;
            text-align: center;
            background-color: #000000;
            z-index: 1000;
        }
        #site-footer a {
            color: #3498db;
            text-decoration: none;
            margin-left: 6px;
            transition: color 0.2s;
        }
        #site-footer a:hover {
            color: #5dade2;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="content">
        <p>Тут очень крутая политика</p>
    </div>

    <div id="site-footer">
