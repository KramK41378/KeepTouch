<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.2, minimum-scale=0.8">
    <title>KeepTouch — Главное окно</title>
    <link rel="icon" href="{{ url_for('static', filename='images/icon.png') }}">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #ffffff;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(52, 152, 219, 0.3);
        }
        .nav-button {
            background: none;
            border: none;
            color: #cccccc;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 10px 20px;
            transition: all 0.3s ease;
            border-radius: 10px;
        }
        .nav-button:hover {
            background-color: rgba(52, 152, 219, 0.2);
            color: #3498db;
        }
        .nav-button.active {
            background-color: rgba(52, 152, 219, 0.4);
            color: #ffffff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .content-area {
            min-height: calc(100vh - 200px);
            padding: 30px;
        }
        .profile-message {
            text-align: center;
            font-size: 2rem;
            color: #3498db;
            margin-top: 50px;
        }
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }
        .post-card {
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }
        .post-card:hover {
            transform: translateY(-5px);
        }
        .post-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .post-caption {
            padding: 20px;
            font-size: 1rem;
            line-height: 1.4;
            color: #cccccc;
        }
        #site-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px 0;
            color: #999;
            font-size: 13px;
            text-align: center;
            background-color: #000000;
            z-index: 1000;
        }
        #site-footer a {
            color: #3498db;
            text-decoration: none;
            margin-left: 6px;
            transition: color 0.2s;
        }
        #site-footer a:hover {
            color: #5dade2;
            text-decoration: underline;
        }
        .add-post-btn {
            display: block;
            margin: 20px auto 30px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
        }
        .add-post-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.5);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(52, 152, 219, 0.3);
            position: relative;
            color: #ffffff;
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 1.8rem;
            cursor: pointer;
            color: #cccccc;
            transition: color 0.3s;
        }
        .modal-close:hover {
            color: #ff6b6b;
        }
        .modal-content h3 {
            margin: 0 0 25px 0;
            color: #3498db;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #cccccc;
            font-size: 0.95rem;
        }
        .form-group input[type="file"],
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(52, 152, 219, 0.3);
            background-color: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 70px;
        }
        .image-preview {
            margin-top: 12px;
            text-align: center;
        }
        .image-preview img {
            max-width: 100%;
            max-height: 180px;
            border-radius: 10px;
            object-fit: contain;
            border: 1px solid rgba(52, 152, 219, 0.3);
        }
        .post-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }
        .post-btn:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .post-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.4);
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="nav-button active" id="profileBtn">Профиль</button>
        <button class="nav-button" id="postsBtn">Посты</button>
    </div>

    <div class="container">
        <div class="content-area" id="contentArea">
            <div class="profile-message" id="profileMessage">
                Вы находитесь в профиле
            </div>
        </div>
    </div>

    <div id="site-footer">
        © 2026 KeepTouch. Все права защищены. | <a href="policy.html">Политика конфиденциальности</a>
    </div>

    <div id="createPostModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" id="modalClose">&times;</span>
            <h3>Новый пост</h3>

            <div class="form-group">
                <label for="postImageInput">Выберите фото (JPG):</label>
                <input type="file" id="postImageInput" accept="image/jpeg, image/jpg">
                <div id="imagePreview" class="image-preview"></div>
            </div>

            <div class="form-group">
                <label for="postCaption">✍Подпись:</label>
                <textarea id="postCaption" rows="3" placeholder="Напишите что-нибудь..."></textarea>
            </div>

            <button id="postSubmitBtn" class="post-btn" disabled>Запостить</button>
        </div>
    </div>
</body>
</html>
